<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Columns and Rows</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fefefe;
      color: #333;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      gap: 10px;
      padding: 10px;
      max-width: 1200px;
      margin: auto;
    }

    .grid-container > * {
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .grid-container > *:hover {
      transform: translateY(-3px);
    }

    header   { background: #ed7b83; color: white; }
    nav      { background: #ec8a90; color: white; }
    main     { background: #eba2a4; }
    .c2      { background: #f0b9bb; }
    .c3      { background: #f0b9bb; }
    aside    { background: #e6d1ca; }
    footer   { background: #eee9c7; }

    @media (min-width: 720px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto auto 1fr auto auto;
      }

      header   { grid-column: 1 / 4; }
      nav      { grid-column: 1 / 4; }
      main     { grid-column: 1 / 3; }
      .c2      { grid-column: 1 / 2; }
      .c3      { grid-column: 2 / 3; }
      aside    { grid-column: 3 / 4; grid-row: 3 / 5; }
      footer   { grid-column: 1 / 4; }
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <header><h1>Header</h1></header>
    <nav><strong>Nav</strong></nav>
    <main><p>Contenido principal</p></main>
    <div class="c2"><p>Contenido 2</p></div>
    <div class="c3"><p>Contenido 3</p></div>
    <aside><p>Aside</p></aside>
    <footer><p>Footer</p></footer>
  </div>
</body>
</html>
